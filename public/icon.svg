<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#57292d" />
      <stop offset="50%" stopColor="#7a343b" />
      <stop offset="100%" stopColor="#472326" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffe4a0" />
      <stop offset="50%" stopColor="#e5a36f" />
      <stop offset="100%" stopColor="#c48b52" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="180" height="180" rx="44" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="172" height="172" rx="40" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />
  
  <!-- Baby Princess Crown -->
  <path d="M50 78L62 108H118L130 78L106 92L90 68L74 92L50 78Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="50" cy="74" r="5" fill="#ffe4a0" />
  <circle cx="74" cy="88" r="4" fill="#ffb6c1" />
  <circle cx="90" cy="64" r="6" fill="#ffe4a0" />
  <circle cx="106" cy="88" r="4" fill="#ffb6c1" />
  <circle cx="130" cy="74" r="5" fill="#ffe4a0" />

  <!-- "1" for 1st Birthday -->
  <text x="90" y="148" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#fffaf4" text-anchor="middle" letter-spacing="1">1</text>
  
  <!-- Little Sparkle / Heart -->
  <path d="M118 120C118 116 122 113 125 113C128 113 130 115 130 118C130 122 125 127 125 127C125 127 120 122 118 120Z" fill="#e8607a" />
</svg>